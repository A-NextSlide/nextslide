services:
  - type: web
    name: slide-backend
    env: python
    repo: https://github.com/A-NextSlide/nextslide
    branch: main
    rootDirectory: apps/backend
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && modal deploy modal_app.py"
    # Single worker is safe: Modal handles heavy compute, this server just routes
    # HTTP + proxies SSE streams. Scale to multi-worker only after adding Redis
    # for shared state (dedup cache, agent stream bus, WebSocket connections).
    startCommand: "gunicorn api.chat_server:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT} --timeout 120 --graceful-timeout 30"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
