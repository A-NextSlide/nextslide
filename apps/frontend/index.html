<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextSlide is joining OpenAI</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="description" content="NextSlide has been acquired by OpenAI. A note from founder Ahmed Beshry." />
    <meta name="author" content="NextSlide" />
    <meta property="og:title" content="NextSlide is joining OpenAI" />
    <meta property="og:description" content="NextSlide has been acquired by OpenAI. A note from founder Ahmed Beshry." />
    <meta property="og:image" content="https://nextslide.ai/og-image-acquisition-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NextSlide is joining OpenAI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nextslide.ai" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NextSlide is joining OpenAI" />
    <meta name="twitter:description" content="NextSlide has been acquired by OpenAI. A note from founder Ahmed Beshry." />
    <meta name="twitter:image" content="https://nextslide.ai/og-image-acquisition-v2.png" />
    <meta name="twitter:image:alt" content="NextSlide is joining OpenAI" />

    <!-- Preload critical announcement typefaces to avoid FOUT -->
    <link rel="preload" href="/fonts/HKGroteskWide-Black.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/HKGroteskWide-Medium.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Alerio%20Sans%20Serif/Files/OTF/Alerio-Regular.otf" as="font" type="font/otf" crossorigin />

    <!-- Hide content until HK Grotesk is loaded -->
    <style>
      #root { opacity: 0; }
      .fonts-ready #root { opacity: 1; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Wait for HK Grotesk Wide to load before showing content
      document.fonts.ready.then(function () {
        document.documentElement.classList.add('fonts-ready');
      });
      // Safety fallback — show content after 2s even if font fails
      setTimeout(function () {
        document.documentElement.classList.add('fonts-ready');
      }, 2000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
